[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "error-claim-audit"
version = "0.1.0"
description = "Offline audit of documented Python error behaviour"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "error-claim-audit contributors"}]
dependencies = []

[project.scripts]
error-claim-audit = "error_claim_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
